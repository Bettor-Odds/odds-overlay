name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Stage APKs
        run: |
          mkdir -p out
          # Stable name so the landing-page button never changes across releases.
          cp app/build/outputs/apk/debug/app-debug.apk out/odds-overlay.apk
          # Versioned copy for the release archive.
          cp app/build/outputs/apk/debug/app-debug.apk "out/odds-overlay-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: odds-overlay-apk
          path: out/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            One-tap install page: https://REPO_OWNER.github.io/odds-overlay/

            Or download odds-overlay.apk below, open it on an Android phone, and follow the prompts.
